<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusShield — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css" />
  <script>
    // Immediate Auto-Login check before DOM renders to prevent reset on app relaunch
    (function() {
      try {
        const token = localStorage.getItem('cs_token');
        const userStr = localStorage.getItem('cs_user');
        if (token && userStr) {
          const user = JSON.parse(userStr);
          if (user && user.role) {
            const redirectParam = new URLSearchParams(window.location.search).get('redirect');
            if (redirectParam) {
              window.location.replace(redirectParam);
              return;
            }
            if (user.role === 'admin' || user.role === 'faculty') {
              window.location.replace('admin.html');
              return;
            } else if (user.role === 'security') {
              window.location.replace('security.html');
              return;
            } else {
              window.location.replace('student.html');
              return;
            }
          }
        }
      } catch (err) {
        console.warn('Auto-login fast check error:', err);
      }
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-center items-center p-4">

  <main class="w-full max-w-sm">
    <!-- Header: Simple Logo & Title -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-[#1E3A5F] text-white text-xl font-bold mb-2 shadow-xs">
        🛡️
      </div>
      <h1 class="text-xl font-bold text-[#1E3A5F]">CampusShield</h1>
      <p class="text-xs text-slate-500">Campus Safety & Emergency Response</p>
    </div>

    <!-- Login Box -->
    <div class="bg-white border border-slate-200 rounded-lg p-5 shadow-xs space-y-4">
      
      <!-- Role Selection -->
      <div class="grid grid-cols-3 gap-1 p-1 bg-slate-100 rounded text-xs font-semibold">
        <button type="button" id="tab-student" onclick="selectRole('student')" 
                class="role-tab-btn py-1.5 rounded text-center transition bg-[#1E3A5F] text-white">
          Student
        </button>
        <button type="button" id="tab-security" onclick="selectRole('security')" 
                class="role-tab-btn py-1.5 rounded text-center transition text-slate-600 hover:text-slate-900">
          Security
        </button>
        <button type="button" id="tab-admin" onclick="selectRole('admin')" 
                class="role-tab-btn py-1.5 rounded text-center transition text-slate-600 hover:text-slate-900">
          Admin
        </button>
      </div>

      <!-- Error / Validation Banner -->
      <div id="auth-alert-banner" class="hidden p-3 rounded text-xs font-medium border flex items-start gap-2">
        <span id="auth-alert-icon" class="shrink-0 text-sm">⚠️</span>
        <div id="auth-alert-msg" class="flex-1"></div>
      </div>

      <!-- Login Form -->
      <form id="campus-login-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
        
        <div>
          <label id="credential-label" for="login-credential" class="block text-xs font-semibold text-slate-700 mb-1">
            Email or Roll Number
          </label>
          <input type="text" id="login-credential" required autocomplete="username"
                 placeholder="e.g. 22CS001 or student@college.edu"
                 class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-[#1E3A5F] focus:ring-1 focus:ring-[#1E3A5F]" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="block text-xs font-semibold text-slate-700">
              Password
            </label>
            <button type="button" onclick="openForgotPasswordModal()" class="text-xs text-blue-600 hover:underline">
              Forgot?
            </button>
          </div>
          <div class="relative">
            <input type="password" id="login-password" required autocomplete="current-password"
                   placeholder="Enter password"
                   class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-[#1E3A5F] focus:ring-1 focus:ring-[#1E3A5F] pr-10" />
            <button type="button" onclick="togglePasswordVisibility()" title="Show/Hide Password"
                    class="absolute right-0 top-0 bottom-0 px-3 flex items-center text-slate-400 hover:text-slate-600 text-xs">
              <span id="password-toggle-icon">👁️</span>
            </button>
          </div>
        </div>

        <!-- Persistent Credentials Option -->
        <div class="flex items-center justify-between text-xs pt-0.5">
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-700 select-none">
            <input type="checkbox" id="remember-credentials" checked
                   class="w-3.5 h-3.5 rounded border-slate-300 text-[#1E3A5F] focus:ring-[#1E3A5F]" />
            <span class="font-medium">Remember credentials</span>
          </label>
          <span class="text-[11px] text-emerald-700 font-medium flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
            Stay signed in
          </span>
        </div>

        <button type="submit" id="login-submit-btn"
                class="w-full py-2.5 px-4 bg-[#1E3A5F] hover:bg-[#152843] text-white font-semibold text-sm rounded shadow-xs transition flex items-center justify-center gap-2">
          <span id="login-btn-text">Sign In</span>
          <div id="login-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </form>

    </div>

    <!-- Hidden element for API discovery compatibility -->
    <div id="backend-status-badge" class="hidden"><span id="login-server-name"></span></div>
  </main>

  <!-- Password Reset Modal -->
  <div id="forgot-password-modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full p-5 rounded-lg border border-slate-200 shadow-md space-y-3">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <h3 class="text-sm font-bold text-slate-900">Reset Password</h3>
        <button onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
      </div>
      <p class="text-xs text-slate-500">
        Enter your institutional email or Roll Number to receive a reset token.
      </p>
      <form onsubmit="handleForgotPassword(event)" class="space-y-3">
        <input type="text" id="forgot-credential" required
               placeholder="e.g. 22CS001 or student@college.edu"
               class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-[#1E3A5F]" />
        <div id="forgot-alert-box" class="hidden p-2.5 rounded text-xs border"></div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" onclick="closeForgotPasswordModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">
            Cancel
          </button>
          <button type="submit" id="forgot-submit-btn" class="px-3 py-1.5 text-xs font-semibold text-white bg-[#1E3A5F] hover:bg-[#152843] rounded">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/api.js"></script>
  <script type="module" src="./js/auth.js"></script>
  <script>
    let currentRole = 'student';

    // Standard credential templates per persona
    const ROLE_DEFAULTS = {
      student: {
        credential: 'sumanth@kongu.edu',
        password: 'Password@123'
      },
      security: {
        credential: 'security.raman@campusshield.kec.edu',
        password: 'Password@123'
      },
      admin: {
        credential: 'admin@campusshield.kec.edu',
        password: 'Password@123'
      }
    };

    window.selectRole = function(role, autoPopulate = true) {
      currentRole = role;
      localStorage.setItem('cs_last_selected_role', role);

      ['student', 'security', 'admin'].forEach(r => {
        const btn = document.getElementById(`tab-${r}`);
        if (!btn) return;
        if (r === role) {
          btn.className = 'role-tab-btn py-1.5 rounded text-center transition bg-[#1E3A5F] text-white';
        } else {
          btn.className = 'role-tab-btn py-1.5 rounded text-center transition text-slate-600 hover:text-slate-900';
        }
      });

      const label = document.getElementById('credential-label');
      const credInput = document.getElementById('login-credential');
      const pwdInput = document.getElementById('login-password');
      const rememberCheckbox = document.getElementById('remember-credentials');

      if (label && credInput) {
        if (role === 'student') {
          label.innerText = 'Email or Roll Number';
          credInput.placeholder = 'e.g. 22CS001 or student@college.edu';
        } else if (role === 'security') {
          label.innerText = 'Officer Email or Badge ID';
          credInput.placeholder = 'e.g. SEC-001 or security.raman@campusshield.kec.edu';
        } else if (role === 'admin') {
          label.innerText = 'Admin Email or Admin ID';
          credInput.placeholder = 'e.g. ADM-001 or admin@campusshield.kec.edu';
        }

        // Restore remembered credentials for this role so they never reset
        if (autoPopulate && (!rememberCheckbox || rememberCheckbox.checked)) {
          const savedCred = localStorage.getItem(`cs_saved_cred_${role}`) || ROLE_DEFAULTS[role]?.credential || '';
          const savedPwd = localStorage.getItem(`cs_saved_pwd_${role}`) || ROLE_DEFAULTS[role]?.password || '';
          if (savedCred) credInput.value = savedCred;
          if (pwdInput && savedPwd) pwdInput.value = savedPwd;
        }
      }
    };

    window.togglePasswordVisibility = function() {
      const input = document.getElementById('login-password');
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
    };

    window.openForgotPasswordModal = function() {
      document.getElementById('forgot-password-modal')?.classList.remove('hidden');
    };

    window.closeForgotPasswordModal = function() {
      document.getElementById('forgot-password-modal')?.classList.add('hidden');
    };

    window.handleForgotPassword = async function(e) {
      e.preventDefault();
      const cred = document.getElementById('forgot-credential')?.value?.trim();
      const alertBox = document.getElementById('forgot-alert-box');
      const btn = document.getElementById('forgot-submit-btn');
      if (!cred || !alertBox || !btn) return;

      try {
        btn.disabled = true;
        btn.innerText = 'Submitting...';
        const res = await window.csAuth.forgotPassword(cred);
        alertBox.className = 'p-2.5 rounded text-xs border border-emerald-300 bg-emerald-50 text-emerald-800';
        alertBox.innerHTML = `<strong>Reset Token:</strong> <code class="font-mono bg-white px-1 py-0.5 rounded border">${res.resetToken || 'TOKEN-SENT'}</code>`;
        alertBox.classList.remove('hidden');
      } catch (err) {
        alertBox.className = 'p-2.5 rounded text-xs border border-red-300 bg-red-50 text-red-800';
        alertBox.innerText = err.message || 'Could not initiate reset.';
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit';
      }
    };

    window.handleFormSubmit = async function(e) {
      e.preventDefault();
      const banner = document.getElementById('auth-alert-banner');
      const bannerMsg = document.getElementById('auth-alert-msg');
      const spinner = document.getElementById('login-spinner');
      const btnText = document.getElementById('login-btn-text');
      const submitBtn = document.getElementById('login-submit-btn');
      const rememberCheckbox = document.getElementById('remember-credentials');

      if (banner) banner.classList.add('hidden');

      const credential = document.getElementById('login-credential')?.value?.trim();
      const password = document.getElementById('login-password')?.value;

      if (!credential || !password) {
        if (banner && bannerMsg) {
          bannerMsg.innerText = 'Please enter both your identifier and password.';
          banner.className = 'p-3 rounded text-xs font-medium border border-amber-300 bg-amber-50 text-amber-900 flex items-start gap-2';
          banner.classList.remove('hidden');
        }
        return;
      }

      // Persist credentials if remember is checked so they never reset on exit
      if (!rememberCheckbox || rememberCheckbox.checked) {
        localStorage.setItem('cs_remember_me', 'true');
        localStorage.setItem(`cs_saved_cred_${currentRole}`, credential);
        localStorage.setItem(`cs_saved_pwd_${currentRole}`, password);
        localStorage.setItem('cs_last_selected_role', currentRole);
      } else {
        localStorage.setItem('cs_remember_me', 'false');
      }

      try {
        if (spinner) spinner.classList.remove('hidden');
        if (btnText) btnText.innerText = 'Signing in...';
        if (submitBtn) submitBtn.disabled = true;

        const authRes = await window.csAuth.login(credential, password, currentRole);
        const destination = (authRes && authRes.redirectUrl) ? authRes.redirectUrl : window.csAuth.getDashboardUrl(currentRole);
        window.location.replace(destination);
      } catch (err) {
        if (banner && bannerMsg) {
          bannerMsg.innerText = err.message || 'Authentication failed. Please verify credentials.';
          banner.className = 'p-3 rounded text-xs font-medium border border-red-300 bg-red-50 text-red-900 flex items-start gap-2';
          banner.classList.remove('hidden');
        }
      } finally {
        if (spinner) spinner.classList.add('hidden');
        if (btnText) btnText.innerText = 'Sign In';
        if (submitBtn) submitBtn.disabled = false;
      }
    };

    // Auto-populate remembered role and credentials on initial page display
    document.addEventListener('DOMContentLoaded', () => {
      const rememberCheckbox = document.getElementById('remember-credentials');
      const isRemembered = localStorage.getItem('cs_remember_me') !== 'false';
      if (rememberCheckbox) rememberCheckbox.checked = isRemembered;

      const initialRole = localStorage.getItem('cs_last_selected_role') || 'student';
      selectRole(initialRole, true);
    });
  </script>
</body>
</html>
