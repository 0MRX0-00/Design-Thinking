<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Shield Outline -->
  <path d="M256 70 L390 120 C390 270 290 380 256 430 C222 380 122 270 122 120 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" 
        opacity="0.95" />

  <!-- Inner Shield Core -->
  <path d="M256 95 L368 138 C368 262 284 356 256 398 C228 356 144 262 144 138 Z" 
        fill="#090d16" 
        stroke="#38bdf8" 
        stroke-width="6" />

  <!-- Emergency Flash Lightning / Siren Beacon -->
  <path d="M266 140 L200 256 L248 256 L236 360 L318 234 L270 234 Z" 
        fill="#f59e0b" 
        stroke="#fef08a" 
        stroke-width="3" 
        filter="url(#glow)" />
</svg>
